
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Cổng Thi Đấu Thể Thao Vĩnh Long</title>

  <meta name="theme-color" content="#008f43">
  <meta name="description" content="Cổng truy cập hệ thống thi đấu thể thao Vĩnh Long">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thi Đấu Vĩnh Long">

  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --green: #008f43;
      --green-dark: #006b32;
      --navy: #17375e;
      --muted: #5c6b7b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at top left, #d7f3df, transparent 45%),
        linear-gradient(145deg, #eef7f1, #f5f8ff);
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dcefe2;
      border-radius: 26px;
      box-shadow: 0 16px 48px rgba(21, 55, 91, 0.12);
    }

    .logo {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 5.5vw, 28px);
      line-height: 1.4;
    }

    .province {
      margin-top: 8px;
      color: var(--green);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .description {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .enter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      margin-top: 26px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--green);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 143, 67, 0.22);
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter:hover,
    .enter:focus-visible {
      background: var(--green-dark);
    }

    .note {
      margin: 20px 0 0;
      color: #748092;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      .card {
        padding: 26px 18px;
      }

      .logo {
        width: 125px;
        height: 125px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .enter {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="logo">
      <img
        src="./icon.png"
        alt="Logo cúp vàng và biểu tượng Vĩnh Long"
        width="150"
        height="150"
        onerror="this.style.display='none'; document.getElementById('logoFallback').hidden=false;"
      >
      <div
        id="logoFallback"
        hidden
        aria-label="Biểu tượng cúp"
        style="font-size:72px;"
      >🏆</div>
    </div>

    <h1>CỔNG THI ĐẤU THỂ THAO</h1>

    <div class="province">VĨNH LONG</div>

    <p class="description">
      Hệ thống quản lý thi đấu, kết quả và tổng sắp huy chương.
    </p>

    <a
      class="enter"
      href="https://script.google.com/macros/s/AKfycbxvS-CG-mv2qfXzWCumH6k1cb6UhoPMoNzsmKg_-7mPVz1UsIFKo9mOZxYiy-fHlFGbsQ/exec"
      rel="noopener noreferrer"
    >
      <span aria-hidden="true">🏆</span>
      <span>VÀO HỆ THỐNG</span>
    </a>

    <p class="note">
      Cổng truy cập hệ thống thi đấu thể thao Vĩnh Long.
      Vui lòng kết nối Internet để sử dụng.
    </p>

  </main>
</body>
</html>
