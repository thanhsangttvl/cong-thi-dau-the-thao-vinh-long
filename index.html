
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Cổng Thể Dục Thể Thao Vĩnh Long</title>
  <meta name="description" content="Cổng quản lý thi đấu thể thao, kết quả và tổng sắp huy chương Vĩnh Long.">
  <meta name="theme-color" content="#07833e">

  <!-- ICON TRÊN TRÌNH DUYỆT -->
  <link rel="icon" type="image/png" href="./logo.png?v=20261026">
  <link rel="apple-touch-icon" href="./logo.png?v=20261026">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: #173b2a;
      background: linear-gradient(145deg, #e8f8ef, #f7fbfd);
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 30px 26px 26px;
      text-align: center;
      background: #fff;
      border: 1px solid #d5eadc;
      border-radius: 26px;
      box-shadow: 0 12px 36px rgba(0, 90, 40, 0.10);
    }

    /* Khu vực logo nhỏ gọn, không để khoảng trắng quá lớn */
    .logo-wrap {
      width: min(62vw, 230px);
      height: min(62vw, 230px);
      margin: 0 auto 22px;
      overflow: hidden;
      border-radius: 50%;
      background: transparent;
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border: 0;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      color: #08783c;
      font-size: clamp(21px, 5vw, 28px);
      font-weight: 900;
      line-height: 1.35;
    }

    .province {
      margin: 10px 0 18px;
      color: #d71935;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 900;
      letter-spacing: 3px;
    }

    .description {
      margin: 0 auto;
      max-width: 420px;
      color: #627568;
      font-size: 15px;
      line-height: 1.8;
    }

    .enter-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      margin: 26px auto 18px;
      padding: 15px 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #07984b, #006b35);
      box-shadow: 0 7px 18px rgba(7, 131, 62, 0.22);
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-button:hover {
      filter: brightness(1.05);
    }

    .note {
      margin: 0;
      color: #748176;
      font-size: 12px;
      line-height: 1.7;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .feature {
      padding: 8px 11px;
      border: 1px solid #dcece1;
      border-radius: 999px;
      background: #f5fbf6;
      color: #356348;
      font-size: 12px;
      font-weight: 700;
    }

    footer {
      padding-top: 18px;
      text-align: center;
      color: #748176;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      .logo-wrap {
        width: min(58vw, 205px);
        height: min(58vw, 205px);
        margin-bottom: 20px;
      }

      .enter-button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="logo-wrap">
      <img
        class="logo"
        src="./logo.png?v=20261026"
        alt="Logo Thể dục Thể thao Vĩnh Long"
        width="230"
        height="230"
        onerror="this.parentElement.style.display='none';"
      >
    </div>

    <h1>THỂ DỤC THỂ THAO</h1>
    <p class="province">VĨNH LONG · 2026</p>

    <p class="description">
      Cổng thông tin quản lý thi đấu, cập nhật kết quả
      và tổng sắp huy chương thể thao tỉnh Vĩnh Long.
    </p>

    <a
      class="enter-button"
      href="https://script.google.com/macros/s/AKfycbxvS-CG-mv2qfXzWCumH6k1cb6UhoPMoNzsmKg_-7mPVz1UsIFKo9mOZxYiy-fHlFGbsQ/exec"
    >
      <span aria-hidden="true">🏆</span>
      <span>VÀO HỆ THỐNG THI ĐẤU</span>
      <span aria-hidden="true">→</span>
    </a>

    <p class="note">
      Vui lòng kết nối Internet để sử dụng hệ thống.
    </p>

    <div class="features">
      <span class="feature">🏃 Thi đấu</span>
      <span class="feature">📋 Kết quả</span>
      <span class="feature">🥇 Huy chương</span>
    </div>

  </main>

  <footer>
    © 2026 · Thể Dục Thể Thao Vĩnh Long
  </footer>
</body>
</html>
