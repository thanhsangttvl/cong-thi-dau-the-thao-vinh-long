
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <meta name="description" content="Cổng truy cập hệ thống thi đấu thể thao Vĩnh Long">
  <title>Cổng Thi Đấu Thể Thao Vĩnh Long</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf3ff, #f8fbff);
      color: #17345c;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px #17345c1a;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: #eaf3ff;
      font-size: 64px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.4;
      margin: 10px 0;
    }

    .province {
      color: #174a8b;
      font-size: 19px;
      font-weight: bold;
    }

    p {
      color: #53657d;
      line-height: 1.7;
    }

    .enter {
      display: block;
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #174a8b;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .enter:hover {
      background: #103766;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-label="Biểu tượng thể thao">🏆</div>

    <h1>CỔNG THI ĐẤU THỂ THAO</h1>
    <div class="province">VĨNH LONG</div>

    <p>
      Hệ thống quản lý thi đấu, kết quả
      và tổng sắp huy chương.
    </p>

    <a
      class="enter"
      href="https://script.google.com/macros/s/AKfycbxvS-CG-mv2qfXzWCumH6k1cb6UhoPMoNzsmKg_-7mPVz1UsIFKo9mOZxYiy-fHlFGbsQ/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      🏆 VÀO HỆ THỐNG
    </a>

    <p class="note">
      Cổng truy cập hệ thống thi đấu thể thao Vĩnh Long.
    </p>
  </main>
</body>
</html>
